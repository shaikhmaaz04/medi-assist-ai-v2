name: Keep Streamlit Awake

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Streamlit
        run: |
          curl -I https://medi-assist-ai-rag-v2.streamlit.app